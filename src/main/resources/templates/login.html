<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Bolão Copa 2026</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-container">
    <h2>Entrar no Bolão</h2>

    <form th:action="@{/login}" method="POST">

        <label for="username">E-mail:</label>
        <input type="email" id="username" name="username" required placeholder="teste@email.com">

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required placeholder="******">

        <button type="submit">Entrar</button>
    </form>

    <p th:if="${param.error}" style="color: red; margin-top: 10px;">
        E-mail ou senha inválidos. Por favor, tente novamente.
    </p>

    <p th:if="${param.sair}" style="color: green; margin-top: 10px;">
        Você saiu do sistema com sucesso!
    </p>
</div>

</body>
</html>
