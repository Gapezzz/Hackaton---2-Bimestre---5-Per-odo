<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | Bolão Copa 2026</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-container">
    <h2>🏆 Bolão Copa 2026</h2>
    <p style="color: #64748b; margin-bottom: 20px;">Faça login para continuar</p>

    <form th:action="@{/login}" method="POST">
        <label for="username" style="display: block; text-align: left; font-weight: 500;">E-mail</label>
        <input type="email" id="username" name="username" required placeholder="exemplo@email.com">

        <label for="password" style="display: block; text-align: left; font-weight: 500;">Senha</label>
        <input type="password" id="password" name="password" required placeholder="••••••">

        <button type="submit">Entrar no Sistema</button>
    </form>

    <div th:if="${param.error}" style="background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.9rem;">
        E-mail ou senha incorretos.
    </div>
    <div th:if="${param.sair}" style="background: #dcfce7; color: #166534; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.9rem;">
        Você foi desconectado com segurança.
    </div>
</div>

</body>
</html>
