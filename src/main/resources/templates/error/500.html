<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <div th:replace="~{fragments/layout :: head-comum('Erro no Sistema')}"></div>
    <style>
        .error-container { text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 600px; border-top: 5px solid #dd6b20; margin: 80px auto 0 auto; }
        .btn-error { display: inline-block; background-color: #3182ce; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body style="background-color: #f7fafc; margin: 0;">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="error-container">
    <h1 style="font-size: 48px; margin: 0; color: #dd6b20;">500</h1>
    <h2 style="font-size: 24px; margin: 10px 0;">Ops, algo deu errado!</h2>
    <p style="color: #718096; line-height: 1.6;">Nosso sistema passou por uma instabilidade técnica interna.</p>
    <div th:if="${message}" style="text-align: left; background: #edf2f7; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 13px; max-height: 150px; overflow-y: auto; color: #e53e3e; margin-bottom: 20px; border: 1px solid #cbd5e0;">
        <strong>Detalhes do erro:</strong> <span th:text="${message}">Mensagem</span>
    </div>
    <a th:href="@{/dashboard}" class="btn-error">Voltar ao Dashboard</a>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
