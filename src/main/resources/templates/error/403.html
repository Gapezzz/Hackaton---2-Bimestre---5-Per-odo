<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>

        .btn-error { display: inline-block; background-color: #3182ce; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 15px; }

    <p style="color: #718096; line-height: 1.6;">Você não possui as permissões necessárias para visualizar ou modificar esta página.</p>

<div th:replace="~{fragments/layout :: footer}"></div>

</html>
