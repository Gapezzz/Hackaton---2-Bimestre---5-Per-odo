<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <div th:replace="~{fragments/layout :: head-comum('Gerenciamento de Usuários')}"></div>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7fafc; margin: 0; color: #2d3748; padding-bottom: 60px;">

<div th:replace="~{fragments/layout :: navbar}"></div>

<main style="padding: 30px; max-width: 1200px; margin: 0 auto;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Usuários Cadastrados</h3>
        <a th:href="@{/admin/usuarios/novo}"
           style="background-color: #38a169; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px;">
            Incluir Novo Usuário
        </a>
    </div>

    <table border="1" style="width: 100%; border-collapse: collapse; background: white; text-align: left; border: 1px solid #cbd5e0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
        <thead>
        <tr style="background-color: #e2e8f0;">
            <th style="padding: 12px; border: 1px solid #cbd5e0;">ID</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Nome</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">E-mail</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Perfil</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Status</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}" style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 12px; border: 1px solid #cbd5e0;" th:text="${u.id}"></td>
            <td style="padding: 12px; border: 1px solid #cbd5e0;" th:text="${u.nome}"></td>
            <td style="padding: 12px; border: 1px solid #cbd5e0;" th:text="${u.email}"></td>
            <td style="padding: 12px; border: 1px solid #cbd5e0; font-weight: bold;" th:text="${u.perfil}"></td>
            <td style="padding: 12px; border: 1px solid #cbd5e0;">
                <span th:text="${u.ativo} ? 'Ativo' : 'Bloqueado'"
                      th:style="${u.ativo} ? 'color: #38a169; font-weight: bold;' : 'color: #e53e3e; font-weight: bold;'">
                </span>
            </td>
            <td style="padding: 12px; border: 1px solid #cbd5e0; display: flex; gap: 8px; align-items: center;">
                <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}"
                   style="background-color: #3182ce; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold;">
                    Alterar
                </a>

                <form th:action="@{/admin/usuarios/status/{id}(id=${u.id})}" method="POST" style="display:inline; margin: 0;">
                    <button type="submit"
                            th:text="${u.ativo} ? 'Bloquear' : 'Ativar'"
                            th:style="${u.ativo} ? 'background-color: #e53e3e; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;' : 'background-color: #38a169; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;'">
                    </button>
                </form>

                <form th:action="@{/admin/usuarios/excluir/{id}(id=${u.id})}" method="POST" style="display:inline; margin: 0;"
                      th:onclick="return confirm('Deseja deletar este usuário permanentemente?');">
                    <button type="submit" style="background-color: #4a5568; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;">
                        Excluir
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
