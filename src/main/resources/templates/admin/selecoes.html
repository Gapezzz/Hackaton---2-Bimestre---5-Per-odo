<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <div th:replace="~{fragments/layout :: head-comum('Gerenciamento de Seleções')}"></div>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7fafc; margin: 0; color: #2d3748; padding-bottom: 60px;">

<div th:replace="~{fragments/layout :: navbar}"></div>

<main style="padding: 30px; max-width: 1000px; margin: 0 auto;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Seleções Cadastradas</h3>
        <a th:href="@{/admin/selecoes/nova}"
           style="background-color: #38a169; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px;">
            Incluir Nova Seleção
        </a>
    </div>

    <div th:if="${selecoes.empty}" style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; color: #718096;">
        Nenhuma seleção cadastrada ainda.
    </div>

    <table th:unless="${selecoes.empty}" border="1" style="width: 100%; border-collapse: collapse; background: white; text-align: left; border: 1px solid #cbd5e0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <thead>
        <tr style="background-color: #e2e8f0;">
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Bandeira</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Nome</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Código FIFA</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Grupo</th>
            <th style="padding: 12px; border: 1px solid #cbd5e0;">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${selecoes}" style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 10px; border: 1px solid #cbd5e0; text-align: center;">
                <img th:if="${s.urlBandeira != null and !s.urlBandeira.empty}"
                     th:src="${s.urlBandeira}" alt="Bandeira"
                     style="width: 40px; height: 27px; object-fit: cover; border-radius: 3px; border: 1px solid #e2e8f0;" />
                <span th:unless="${s.urlBandeira != null and !s.urlBandeira.empty}" style="color: #a0aec0; font-size: 12px;">—</span>
            </td>
            <td style="padding: 12px; border: 1px solid #cbd5e0; font-weight: 500;" th:text="${s.nome}"></td>
            <td style="padding: 12px; border: 1px solid #cbd5e0;">
                <span th:text="${s.codigoFifa}" style="background: #edf2f7; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 13px;"></span>
            </td>
            <td style="padding: 12px; border: 1px solid #cbd5e0;" th:text="${s.grupo != null} ? 'Grupo ' + ${s.grupo} : '—'"></td>
            <td style="padding: 12px; border: 1px solid #cbd5e0;">
                <div style="display: flex; gap: 6px;">
                    <a th:href="@{/admin/selecoes/editar/{id}(id=${s.id})}"
                       style="background-color: #dd6b20; color: white; padding: 6px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold;">
                        Editar
                    </a>
                    <form th:action="@{/admin/selecoes/excluir/{id}(id=${s.id})}" method="POST" style="display:inline; margin: 0;"
                          onsubmit="return confirm('Deseja remover esta seleção?');">
                        <button type="submit"
                                style="background-color: #e53e3e; color: white; border: none; padding: 6px 10px; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: bold;">
                            Remover
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
