spring.application.name=bolao-copa-2026
server.port=8080
server.servlet.context-path=/

# Configurações do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_bolao_copa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validador de Tabelas MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Segredo para geração dos tokens JWT (altere em produção!)
api.security.token.secret=bolao-copa-2026-segredo-super-secreto-troque-em-producao

# Desativa o caminho de erro padrão para garantir que o Thymeleaf assuma o controle
spring.web.error.path=/error

spring.servlet.multipart.resolve-lazily=true