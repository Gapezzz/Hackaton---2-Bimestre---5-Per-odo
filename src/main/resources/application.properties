spring.application.name=bolao-copa-2026
server.port=8080
server.servlet.context-path=/

# Configurações do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_bolao_copa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validador de Tabelas MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# chave secreta do token
jwt.secret=bolao-copa-2026-chave-secreta-super-grande-trocar-em-producao
jwt.expiracao-ms=86400000